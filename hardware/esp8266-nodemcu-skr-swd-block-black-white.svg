<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150">
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#000}
      .title{font-size:34px;font-weight:700}.sub{font-size:20px;font-weight:700}
      .head{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}
      .note{font-size:17px}.tiny{font-size:15px}.box{fill:#fff;stroke:#000;stroke-width:4}
      .thin{fill:none;stroke:#000;stroke-width:2}.wire{fill:none;stroke:#000;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:#fff;stroke:#000;stroke-width:3;stroke-dasharray:10 7}.pin{fill:#fff;stroke:#000;stroke-width:3}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1600" height="1150" fill="#fff"/>
  <text x="800" y="48" text-anchor="middle" class="title">ESP8266 NodeMCU V3 to BTT SKR Mini E3 V3.0 — SWD</text>
  <text x="800" y="82" text-anchor="middle" class="sub">FUNCTIONAL PROTOTYPE — DO NOT PERMANENTLY INSTALL UNTIL THE VALIDATION TESTS PASS</text>

  <!-- NodeMCU -->
  <rect x="55" y="135" width="365" height="700" rx="18" class="box"/>
  <text x="238" y="178" text-anchor="middle" class="head">ESP8266 NodeMCU V3</text>
  <text x="238" y="207" text-anchor="middle" class="note">Firmware: esp8266_prototype</text>

  <circle cx="420" cy="270" r="10" class="pin"/><text x="390" y="277" text-anchor="end" class="label">A0 — VTREF sense</text>
  <circle cx="420" cy="370" r="10" class="pin"/><text x="390" y="377" text-anchor="end" class="label">D2 / GPIO4 — SWDIO</text>
  <circle cx="420" cy="470" r="10" class="pin"/><text x="390" y="477" text-anchor="end" class="label">GND</text>
  <circle cx="420" cy="570" r="10" class="pin"/><text x="390" y="577" text-anchor="end" class="label">D1 / GPIO5 — SWCLK</text>
  <circle cx="420" cy="690" r="10" class="pin"/><text x="390" y="697" text-anchor="end" class="label">D6 / GPIO12 — RESET drive</text>
  <circle cx="420" cy="765" r="10" class="pin"/><text x="390" y="772" text-anchor="end" class="label">VIN / 5V</text>

  <!-- BTT J11 -->
  <rect x="1270" y="165" width="285" height="620" rx="18" class="box"/>
  <text x="1412" y="205" text-anchor="middle" class="head">BTT J11 SWD</text>
  <text x="1412" y="233" text-anchor="middle" class="note">SKR Mini E3 V3.0</text>

  <circle cx="1270" cy="270" r="10" class="pin"/><text x="1300" y="277" class="label">1 — 3.3V / VTREF</text>
  <circle cx="1270" cy="370" r="10" class="pin"/><text x="1300" y="377" class="label">2 — SWDIO / PA13</text>
  <circle cx="1270" cy="470" r="10" class="pin"/><text x="1300" y="477" class="label">3 — GND</text>
  <circle cx="1270" cy="570" r="10" class="pin"/><text x="1300" y="577" class="label">4 — SWCLK / PA14</text>
  <circle cx="1270" cy="690" r="10" class="pin"/><text x="1300" y="697" class="label">5 — RST / PF2-NRST</text>
  <text x="1412" y="735" text-anchor="middle" class="tiny">Physical row, board text upright:</text>
  <text x="1412" y="758" text-anchor="middle" class="tiny">1=3V3  2=IO  3=GND</text>
  <text x="1412" y="778" text-anchor="middle" class="tiny">4=CLK  5=RST</text>

  <!-- VTREF divider -->
  <path d="M1260 270H930" class="wire"/>
  <rect x="820" y="244" width="110" height="52" class="box"/><text x="875" y="278" text-anchor="middle" class="label">10 kΩ</text>
  <path d="M820 270H420" class="wire"/>
  <circle cx="755" cy="270" r="7" fill="#000"/>
  <path d="M755 270V225" class="wire"/>
  <rect x="700" y="173" width="110" height="52" class="box"/><text x="755" y="207" text-anchor="middle" class="label">100 kΩ</text>
  <path d="M755 173V145" class="wire"/>
  <path d="M720 145H790M730 131H780M742 117H768" class="thin"/>
  <text x="1045" y="247" text-anchor="middle" class="note">SENSE ONLY — never supplies target</text>

  <!-- SWDIO -->
  <path d="M430 370H560" class="wire"/>
  <rect x="560" y="344" width="105" height="52" class="box"/><text x="612" y="378" text-anchor="middle" class="label">47 Ω</text>
  <path d="M665 370H1260" class="wire"/>
  <text x="860" y="354" text-anchor="middle" class="note">SWDIO — bidirectional, 3.3 V</text>

  <!-- Ground -->
  <path d="M430 470H1260" class="wire"/>
  <text x="840" y="454" text-anchor="middle" class="note">COMMON GROUND — connect before signal wires</text>

  <!-- SWCLK -->
  <path d="M430 570H560" class="wire"/>
  <rect x="560" y="544" width="105" height="52" class="box"/><text x="612" y="578" text-anchor="middle" class="label">47 Ω</text>
  <path d="M665 570H1260" class="wire"/>
  <text x="850" y="554" text-anchor="middle" class="note">SWCLK — 3.3 V; no level shifter</text>

  <!-- Reset NPN -->
  <path d="M430 690H525" class="wire"/>
  <rect x="525" y="664" width="115" height="52" class="box"/><text x="582" y="698" text-anchor="middle" class="label">4.7 kΩ</text>
  <path d="M640 690H730" class="wire"/>
  <circle cx="690" cy="690" r="7" fill="#000"/>
  <path d="M690 690V735" class="wire"/>
  <rect x="635" y="735" width="110" height="52" class="box"/><text x="690" y="769" text-anchor="middle" class="label">100 kΩ</text>
  <path d="M690 787V825" class="wire"/><path d="M655 825H725M665 839H715M677 853H703" class="thin"/>

  <rect x="760" y="630" width="190" height="145" rx="12" class="box"/>
  <text x="855" y="661" text-anchor="middle" class="head">Q1 — 2N3904</text>
  <text x="855" y="690" text-anchor="middle" class="note">NPN open collector</text>
  <text x="780" y="724" class="label">B</text><text x="918" y="724" class="label">C</text><text x="850" y="762" class="label">E</text>
  <path d="M730 690H760" class="wire"/>
  <path d="M950 690H1010" class="wire"/>
  <rect x="1010" y="664" width="105" height="52" class="box"/><text x="1062" y="698" text-anchor="middle" class="label">100 Ω</text>
  <path d="M1115 690H1260" class="wire"/>
  <path d="M855 775V825" class="wire"/><path d="M820 825H890M830 839H880M842 853H868" class="thin"/>
  <text x="855" y="805" text-anchor="middle" class="tiny">Emitter to GND</text>
  <text x="855" y="880" text-anchor="middle" class="note">Typical TO-92, flat face toward you: E–B–C</text>
  <text x="855" y="903" text-anchor="middle" class="sub">VERIFY YOUR TRANSISTOR DATASHEET BEFORE POWER</text>

  <!-- ESD/cable -->
  <rect x="1140" y="235" width="95" height="500" rx="10" class="dash"/>
  <text x="1187" y="216" text-anchor="middle" class="tiny">ESD ARRAY</text>
  <text x="1187" y="232" text-anchor="middle" class="tiny">to GND</text>

  <!-- Optional prototype indicators -->
  <rect x="55" y="855" width="435" height="55" rx="8" class="thin"/>
  <text x="72" y="878" class="tiny">Optional: D7/GPIO13 → 2.2 kΩ → Wi-Fi LED → GND.</text>
  <text x="72" y="899" class="tiny">D5/GPIO14: leave open. NodeMCU 3V3: never connect to J11 pin 1.</text>

  <!-- Power subsystem -->
  <rect x="55" y="930" width="1500" height="155" rx="16" class="box"/>
  <text x="85" y="965" class="head">POWER FOR INTERNAL INSTALLATION</text>
  <rect x="85" y="990" width="180" height="60" class="box"/><text x="175" y="1016" text-anchor="middle" class="label">Printer PSU 24 V</text><text x="175" y="1039" text-anchor="middle" class="tiny">24V + GND tap</text>
  <path d="M265 1020H325" class="wire" marker-end="url(#arrow)"/>
  <rect x="330" y="990" width="185" height="60" class="box"/><text x="422" y="1016" text-anchor="middle" class="label">0.5 A fuse/PTC</text><text x="422" y="1039" text-anchor="middle" class="tiny">plus SMBJ28A TVS</text>
  <path d="M515 1020H575" class="wire" marker-end="url(#arrow)"/>
  <rect x="580" y="980" width="310" height="80" class="box"/><text x="735" y="1012" text-anchor="middle" class="label">Protected 24 V → 5 V buck</text><text x="735" y="1038" text-anchor="middle" class="tiny">input rating ≥40 V; stable 5 V, ≥0.5 A</text>
  <path d="M890 1020H950" class="wire" marker-end="url(#arrow)"/>
  <rect x="955" y="990" width="225" height="60" class="box"/><text x="1067" y="1016" text-anchor="middle" class="label">NodeMCU VIN / 5V</text><text x="1067" y="1039" text-anchor="middle" class="tiny">never apply raw 24 V</text>
  <rect x="1220" y="980" width="300" height="80" class="box"/><text x="1370" y="1009" text-anchor="middle" class="label">All grounds common</text><text x="1370" y="1034" text-anchor="middle" class="tiny">PSU − / buck − / NodeMCU GND</text><text x="1370" y="1054" text-anchor="middle" class="tiny">/ J11 pin 3 / Q1 emitter</text>

  <!-- Safety footer -->
  <text x="800" y="1115" text-anchor="middle" class="sub">Use a keyed 10–15 cm detachable SWD cable. Keep it unplugged during normal printing.</text>
  <text x="800" y="1140" text-anchor="middle" class="note">Printer must power the SKR target during SWD. No connection from J11 pin 1 to NodeMCU 3V3.</text>
</svg>
