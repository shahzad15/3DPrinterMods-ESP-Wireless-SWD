[platformio]
default_envs = esp32_production

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D APP_VERSION=\"0.2.0\"
lib_deps =

[env:esp32_production]
platform = espressif32@6.10.0
board = esp32dev
board_build.partitions = partitions.csv

[env:esp8266_prototype]
platform = espressif8266@4.2.1
board = nodemcuv2
board_build.filesystem_size = 2M
upload_port = COM9
upload_speed = 115200

[env:esp8266_esp01_4m]
platform = espressif8266@4.2.1
; ESP-01 pinout with the confirmed 4 MB flash chip. The esp12e board profile
; supplies the correct 4 MB memory layout without changing the physical pins.
board = esp12e
board_build.filesystem_size = 2M
upload_speed = 115200
build_flags =
  ${env.build_flags}
  -D BOARD_ESP01_SWD
